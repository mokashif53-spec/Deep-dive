name: Build Deep Dive Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android SDK and Version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("android/variables.gradle")

          if variables.exists():
              text = variables.read_text()

              text = re.sub(
                  r'compileSdkVersion\s*=\s*\d+',
                  'compileSdkVersion = 36',
                  text
              )

              text = re.sub(
                  r'targetSdkVersion\s*=\s*\d+',
                  'targetSdkVersion = 36',
                  text
              )

              variables.write_text(text)

          build = Path("android/app/build.gradle")
          text = build.read_text()

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 2',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "1.0.1"',
              text,
              count=1
          )

          build.write_text(text)
          PY

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/deepdive-upload.jks

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("deepdive-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  "android {" + signing_config,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              build_types_pos = text.find("buildTypes {")

              if build_types_pos == -1:
                  raise SystemExit("buildTypes block not found")

              release_pos = text.find("release {", build_types_pos)

              if release_pos == -1:
                  raise SystemExit("release block not found")

              signing_line = """
                  signingConfig signingConfigs.release
              """

              insert_pos = release_pos + len("release {")

              text = (
                  text[:insert_pos]
                  + signing_line
                  + text[insert_pos:]
              )

          path.write_text(text)
          PY

      - name: Build AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Deep-Dive-AAB-v1.0.1
          path: android/app/build/outputs/bundle/release/*.aab
